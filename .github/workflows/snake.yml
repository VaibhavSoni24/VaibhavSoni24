name: Generate contribution snake
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VaibhavSoni24
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#EA4335

      - name: Update the profile asset
        run: |
          mkdir -p assets
          cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg

      - name: Commit updated animation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution snake"
          file_pattern: assets/github-contribution-grid-snake.svg
