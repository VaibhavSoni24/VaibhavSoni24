<svg xmlns="http://www.w3.org/2000/svg" width="760" height="54" viewBox="0 0 760 54" role="img" aria-labelledby="title desc">
<title id="title">Vaibhav Soni - fading looping developer introduction</title>
<desc id="desc">Six phrases loop in an eighteen-second cycle. Each phrase fades in for 0.25 seconds, stays fully visible for 1.5 seconds, fades out for 0.25 seconds, followed by one full second of black.</desc>
<rect width="760" height="54" rx="8" fill="#050505"/>
<text x="380" y="34" text-anchor="middle" fill="#E8E8E8" font-family="JetBrains Mono,Consolas,monospace" font-size="17" opacity="0"><tspan>Computer Science Undergraduate</tspan><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.013889;0.097222;0.111111;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></text>
<text x="380" y="34" text-anchor="middle" fill="#E8E8E8" font-family="JetBrains Mono,Consolas,monospace" font-size="17" opacity="0"><tspan>AI &amp; Full-Stack Developer</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.166667;0.180556;0.263889;0.277778;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></text>
<text x="380" y="34" text-anchor="middle" fill="#E8E8E8" font-family="JetBrains Mono,Consolas,monospace" font-size="17" opacity="0"><tspan>Open-Source Contributor</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333333;0.347222;0.430556;0.444444;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></text>
<text x="380" y="34" text-anchor="middle" fill="#E8E8E8" font-family="JetBrains Mono,Consolas,monospace" font-size="17" opacity="0"><tspan>Google Gemini Student Ambassador</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.513889;0.597222;0.611111;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></text>
<text x="380" y="34" text-anchor="middle" fill="#E8E8E8" font-family="JetBrains Mono,Consolas,monospace" font-size="17" opacity="0"><tspan>Game Developer &amp; Creative Builder</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.666667;0.680556;0.763889;0.777778;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></text>
<text x="380" y="34" text-anchor="middle" fill="#E8E8E8" font-family="JetBrains Mono,Consolas,monospace" font-size="17" opacity="0"><tspan>Building useful things, one commit at a time</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833333;0.847222;0.930556;0.944444;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></text>
</svg>